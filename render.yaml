services:
  - type: web
    name: procurement-intelligence
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && cd frontend && npm ci && npm run build
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: procurement-intelligence-db
          property: connectionString
      - key: MARKET_ADMIN_API_KEY
        generateValue: true
      - key: ENABLE_MARKET_SCHEDULER
        value: "false"
      - key: ENABLE_RATE_LIMITING
        value: "true"
      - key: AI_RATE_LIMIT_REQUESTS
        value: "20"
      - key: AI_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://procurement-intelligence-ohbs.onrender.com,https://frontend-rho-beige-67.vercel.app"
      - key: ENABLE_CHAT_AI
        value: "true"
      - key: ENABLE_LANGCHAIN_EXPLANATION
        value: "true"
      - key: HF_TOKEN
        sync: false
      - key: HF_INFERENCE_TIMEOUT_SECONDS
        value: "30"
      - key: ENABLE_SEMANTIC_RETRIEVAL
        value: "false"
      - key: ENABLE_VECTOR_SYNC
        value: "false"
      - key: ENABLE_LIVE_NEWS
        value: "false"

databases:
  - name: procurement-intelligence-db
    plan: free
    region: frankfurt
    databaseName: procurement_intelligence
    user: procurement_intelligence
    ipAllowList: []
